<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // Immediately apply theme before any rendering happens
  (function() {
    try {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark-mode');
      } else {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {
      document.documentElement.classList.add('light-mode');
    }
  })();
</script>
<style>
html.transitions-enabled * { transition: background 0.3s, color 0.3s, border-color 0.3s; }

  html { visibility: hidden; }
  html.dark-mode, html.light-mode { visibility: visible; }
</style>

    
  <!-- Theme loader - must be in head with defer to prevent flash -->
  <script src="js/theme.js" defer></script>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #formMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
    </style>

  <!-- Theme initialization - prevents FOUC (Flash of Unstyled Content) -->
  </head>
<body>
  <div class="page-bordered">
    <!-- Hero Section -->
    <h1>Test Contact Form</h1>
    <p>Use this form to test the database connection.</p>
    <div class="page-frame-inner">
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>
        
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        
        <button type="submit">Send Message</button>
        <div id="formMessage"></div>
      </form>
    </div>
    <footer>
      <!-- Include the same database.js file as in contact.html -->
      <script type="module" src="js/database.js"></script>
      <script src="theme.js" defer></script>
    </footer>
  </div>
</body>
</html>
